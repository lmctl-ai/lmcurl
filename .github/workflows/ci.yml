name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      only:
        description: Run one platform or all five
        required: true
        default: all
        type: choice
        options: [all, linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64]

permissions:
  contents: read

concurrency:
  group: lmcurl-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, name: linux-x64}
          - {os: ubuntu-22.04-arm, name: linux-arm64}
          - {os: macos-15, name: macos-arm64}
          - {os: macos-15-intel, name: macos-x64}
          - {os: windows-2022, name: windows-x64}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    env:
      ONLY_OK: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == matrix.name }}
      LMCURL_LIVE: "0"
      CI: "true"
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.ONLY_OK == 'true'
        with:
          persist-credentials: false
      - name: Build image (glibc 2.28 floor, Linux)
        if: runner.os == 'Linux' && env.ONLY_OK == 'true'
        run: |
          arch=x86_64; [ "$RUNNER_ARCH" = ARM64 ] && arch=aarch64
          docker build -t lmcurl-oldglibc \
            --build-arg "IMAGE=quay.io/pypa/manylinux_2_28_${arch}" \
            -f packaging/oldglibc.Dockerfile packaging
      - name: CMake tools (macOS)
        if: runner.os == 'macOS' && env.ONLY_OK == 'true'
        run: brew install ninja coreutils
      - name: Windows tools
        if: runner.os == 'Windows' && env.ONLY_OK == 'true'
        run: |
          for i in 1 2 3; do
            command -v g++ >/dev/null 2>&1 && command -v ninja >/dev/null 2>&1 && break
            choco install -y mingw ninja && break || sleep 15
          done
          command -v g++ >/dev/null 2>&1 || exit 1
          command -v ninja >/dev/null 2>&1 || exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: runner.os != 'Linux' && env.ONLY_OK == 'true'
        with:
          node-version: 24
      - name: Install pinned lmscript compiler
        if: runner.os != 'Linux' && env.ONLY_OK == 'true'
        run: timeout 180 npm install -g @lmctl-ai/lmctl@0.2.482
      - name: Build and test (Linux, inside the old-glibc image)
        if: runner.os == 'Linux' && env.ONLY_OK == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The workspace is mounted at its host path so any recorded absolute paths stay valid.
        run: |
          timeout 1800 docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI -e LMCURL_LIVE -e GITHUB_TOKEN \
            -e BUILD_JOBS=2 -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" lmcurl-oldglibc ./test.sh
      - name: Build and test
        if: runner.os != 'Linux' && env.ONLY_OK == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: timeout 1800 ./test.sh
      - name: Package tested executable
        if: env.ONLY_OK == 'true'
        run: |
          mkdir -p dist
          suffix=""; [ "$RUNNER_OS" = Windows ] && suffix=.exe
          cp "build/lmcurl${suffix}" "dist/lmcurl-${{ matrix.name }}${suffix}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.ONLY_OK == 'true'
        with:
          name: lmcurl-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  ldap-integration:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'linux-x64'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install pinned lmscript compiler
        run: timeout 180 npm install -g @lmctl-ai/lmctl@0.2.482
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lmcurl-linux-x64
          path: dist
      - name: Download lmldap release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x dist/lmcurl-linux-x64
          mkdir -p "$RUNNER_TEMP/lmldap"
          gh release download v0.1.0 --repo lmctl-ai/lmldap --pattern "lmldap-linux-x64" --dir "$RUNNER_TEMP/lmldap"
          cp "$RUNNER_TEMP/lmldap/lmldap-linux-x64" "$RUNNER_TEMP/lmldap/lmldap"
          chmod +x "$RUNNER_TEMP/lmldap/lmldap"
      - name: Run live LDAPv3 CLI and _lmcode_ integration tests against lmldap
        env:
          LMLDAP_BIN: ${{ runner.temp }}/lmldap/lmldap
          LMCURL_REQUIRE_LMLDAP: "1"
        run: python3 scripts/test-ldap.py dist/lmcurl-linux-x64

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, ldap-integration]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lmcurl-*
          path: dist
          merge-multiple: true
      - name: Check five release assets and checksums
        run: |
          test "$(find dist -maxdepth 1 -type f -name 'lmcurl-*' | wc -l)" -eq 5
          (cd dist && sha256sum lmcurl-* > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already published; preserving its verified assets and checksums."
          else
            gh release create "$GITHUB_REF_NAME" dist/lmcurl-* dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --notes "Five tested platform binaries. Linux builds in a glibc 2.28 image and dynamically links the system glibc (2.28 or newer); macOS and Windows use the documented stub until native TLS packaging is enabled. Licenses: lmcurl --notices."
          fi
